services:
  - type: web
    name: centegix-crm-backend
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: USE_SQLITE
        value: "true"
      - key: JWT_SECRET
        generateValue: true
